kind = "web"
previewPath = "/"
title = "API Failure Simulator"
description = "A developer tool for configuring API failure scenarios, running controlled simulations, inspecting request and response execution details, and replaying prior requests."
version = "1.0.0"
id = "artifacts/api-failure-simulator"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20561

[services.development]
run = "pnpm --filter @workspace/api-failure-simulator run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/api-failure-simulator", "run", "build" ]
serve = "static"
publicDir = "artifacts/api-failure-simulator/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20561"
BASE_PATH = "/"
